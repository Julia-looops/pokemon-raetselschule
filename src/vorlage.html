<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokemon-Schule">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex, nofollow">
<title>Pokemon-Schule</title>
<!--BIBLIOTHEKEN-->
<style>
  html,body{margin:0;background:#0f172a;-webkit-text-size-adjust:100%;}
  input{font-size:20px;}
  /* Auf dem iPad soll nichts versehentlich markiert werden beim schnellen Tippen */
  button{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* Kleine Speicher-Hilfe. Gleiche Form wie im ersten Spiel, damit der
   Spielcode unverändert damit arbeiten kann. */
if (!window.speicher) {
  window.speicher = {
    get: async (k) => {
      const v = localStorage.getItem(k);
      if (v === null) throw new Error("nicht gefunden");
      return { key: k, value: v };
    },
    set: async (k, v) => { localStorage.setItem(k, v); return { key: k, value: v }; }
  };
}
</script>
<!--SPIEL-->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
